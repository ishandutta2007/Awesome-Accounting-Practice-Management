<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0a101f"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><linearGradient id="pill-bg" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#334155" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="35"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="15"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(25px,-15px);opacity:.65}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.22) translate(-20px,20px);opacity:.55}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPillDelayed{0%{transform:translateY(0)}50%{transform:translateY(7px)}}.orb-1{animation:pulseOrb 9s ease-in-out infinite;transform-origin:250px 100px}.orb-2{animation:pulseOrb2 11s ease-in-out infinite;transform-origin:950px 320px}.flow-path{stroke-dasharray:20,10;animation:flowLine 14s linear infinite}.pill-anim-1{animation:floatPill 5s ease-in-out infinite}.pill-