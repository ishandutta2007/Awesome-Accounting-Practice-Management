<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(-20px, 20px); opacity: 0.55; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-1 {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 250px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 950px 320px;
    }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 14s linear infinite;
    }
    .pill-anim-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: floatPillDelayed 6s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .text-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle class="orb-1" cx="220" cy="110" r="160" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="300" r="180" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="210" r="90" fill="#6366f1" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Dynamic Connected Flow Lines (Representing Workflows & Invoicing) -->
  <g fill="none" stroke-width="2">
    <path class="flow-path" d="M -50 260 C 250 160, 400 340, 700 230 C 950 140, 1050 290, 1250 210" stroke="#38bdf8" stroke-opacity="0.45" />
    <path class="flow-path" d="M -50 180 C 200 300, 480 120, 800 280 C 1000 370, 1100 160, 1250 290" stroke="#c084fc" stroke-opacity="0.35" style="animation-direction: reverse; animation-duration: 18s;" />
  </g>

  <!-- Interactive/Decorative Dynamic Floating Pills (Foreground Stays Clean) -->
  <g class="pill-anim-1">
    <g transform="translate(100, 335)">
      <rect width="185" height="38" rx="19" fill="url(#pill-bg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text class="text-pill" x="92" y="24" fill="#7dd3fc" text-anchor="middle">⚡ Workflow Automation</text>
    </g>
    <g transform="translate(680, 335)">
      <rect width="170" height="38" rx="19" fill="url(#pill-bg)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
      <text class="text-pill" x="85" y="24" fill="#e9d5ff" text-anchor="middle">📊 Time &amp; Billing</text>
    </g>
  </g>

  <g class="pill-anim-2">
    <g transform="translate(325, 335)">
      <rect width="155" height="38" rx="19" fill="url(#pill-bg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text class="text-pill" x="77" y="24" fill="#a5b4fc" text-anchor="middle">🔒 Client Portals</text>
    </g>
    <g transform="translate(890, 335)">
      <rect width="190" height="38" rx="19" fill="url(#pill-bg)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
      <text class="text-pill" x="95" y="24" fill="#6ee7b7" text-anchor="middle">🌐 Self-Hosted / Open</text>
    </g>
  </g>

  <!-- Main Content Card & Foreground Text (Crisp, High Contrast, Centered) -->
  <g transform="translate(600, 160)">
    <!-- Category Badge -->
    <rect x="-140" y="-115" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text class="text-pill" x="0" y="-95" fill="#38bdf8" text-anchor="middle" font-size="12">✨ CURATED RESOURCE DIRECTORY</text>

    <!-- Main Title -->
    <text class="text-title" x="0" y="-30" fill="url(#primary-grad)" text-anchor="middle" font-size="44">Awesome Accounting Practice Management</text>

    <!-- Subtitle -->
    <text class="text-sub" x="0" y="20" fill="#e2e8f0" text-anchor="middle" font-size="20">SaaS Platforms, Open-Source Infrastructure &amp; CPA Firm Automation</text>

    <!-- Tagline -->
    <text class="text-sub" x="0" y="55" fill="#94a3b8" text-anchor="middle" font-size="14">Compare Top Commercial Suites &amp; Verified Self-Hosted GitHub Alternatives</text>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="url(#card-border)" stroke-width="2" />
</svg>
